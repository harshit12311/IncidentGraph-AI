<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IncidentGraph AI | Login</title>
    <link rel="stylesheet" href="/frontend/assets/style.css?v=3">
    <style>
        .auth-wrapper {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #f4f6fb;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            padding: 36px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(25, 35, 70, .10);
        }
        .auth-brand { text-align: center; margin-bottom: 28px; }
        .auth-brand h1 { margin: 0 0 8px; font-size: 27px; }
        .auth-brand p { color: #68738a; margin: 0; }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; }
        .auth-tabs button {
            flex: 1; padding: 11px; border: 1px solid #dce1eb;
            border-radius: 8px; background: #f7f8fc; cursor: pointer;
        }
        .auth-tabs button.active { background: #263fba; color: white; }
        .auth-form label { display: block; margin: 15px 0 7px; font-weight: 600; }
        .auth-form input {
            width: 100%; box-sizing: border-box; padding: 12px;
            border: 1px solid #dce1eb; border-radius: 8px; font: inherit;
        }
        .auth-submit {
            width: 100%; margin-top: 24px; padding: 13px;
            border: 0; border-radius: 8px; background: #263fba;
            color: white; font-weight: 600; cursor: pointer;
        }
        .auth-message { margin-top: 16px; color: #c0392b; text-align: center; }
        .auth-note { margin-top: 20px; color: #68738a; font-size: 13px; text-align: center; }
        [hidden] { display: none !important; }

        /* IncidentGraph AI - Professional Authentication UI */
        body {
            margin: 0;
            color: #17243b;
            background: #f3f6fc;
            color-scheme: light;
        }

        .auth-wrapper {
            background:
                radial-gradient(circle at 15% 15%, #e6edff 0, transparent 35%),
                radial-gradient(circle at 85% 85%, #e8f5ff 0, transparent 35%),
                #f3f6fc;
        }

        .auth-card {
            max-width: 430px;
            padding: 40px;
            border: 1px solid #e3eaf4;
            border-radius: 18px;
            box-shadow: 0 18px 55px rgba(31, 52, 91, .10);
        }

        .auth-brand h1 {
            color: #17243b;
            font-size: 29px;
            font-weight: 800;
            letter-spacing: -.7px;
        }

        .auth-brand p {
            color: #64738c;
            font-size: 13px;
            line-height: 1.6;
        }

        .auth-tabs button {
            color: #53627b;
            background: #f3f6fc;
            border: 1px solid #dce4f0;
            font-weight: 700;
            transition: .2s ease;
        }

        .auth-tabs button.active {
            color: #ffffff;
            background: linear-gradient(135deg, #3454d1, #5b6ff5);
            border-color: #4263eb;
            box-shadow: 0 4px 12px rgba(66, 99, 235, .2);
        }

        .auth-form label {
            color: #263650;
            font-size: 13px;
            font-weight: 700;
        }

        .auth-form input:not([type="checkbox"]) {
            min-height: 45px;
            color: #17243b;
            background: #ffffff;
            border: 1px solid #cbd6e5;
            border-radius: 9px;
            outline: none;
            transition: border-color .2s, box-shadow .2s;
        }

        .auth-form input::placeholder {
            color: #8995a8;
        }

        .auth-form input:focus {
            border-color: #4263eb;
            box-shadow: 0 0 0 3px rgba(66, 99, 235, .12);
        }

        .auth-form input[type="checkbox"] {
            accent-color: #4263eb;
        }

        .auth-submit {
            min-height: 46px;
            background: linear-gradient(135deg, #3454d1, #5b6ff5);
            font-size: 14px;
            box-shadow: 0 5px 14px rgba(66, 99, 235, .18);
        }

        .auth-submit:hover {
            background: linear-gradient(135deg, #2948bd, #4c60e5);
        }

        .auth-message {
            color: #b42318;
            font-size: 13px;
            line-height: 1.5;
        }

        .auth-note {
            color: #71809a;
            font-size: 12px;
            line-height: 1.6;
        }

        @media (max-width: 520px) {
            .auth-wrapper {
                padding: 16px;
            }

            .auth-card {
                padding: 28px 22px;
            }
        }


        .auth-logo {
            width: 52px;
            height: 52px;
            margin: 0 auto 16px;
            display: grid;
            place-items: center;
            border-radius: 15px;
            background: linear-gradient(135deg, #3454d1, #647bff);
            color: #ffffff;
            font-size: 21px;
            font-weight: 800;
            letter-spacing: -1px;
            box-shadow: 0 7px 18px rgba(66, 99, 235, .24);
        }

        .auth-brand .auth-security {
            margin-top: 10px;
            color: #71809a;
            font-size: 12px;
            font-weight: 500;
        }

    </style>
</head>
<body>
    <main class="auth-wrapper">
        <section class="auth-card">
            <div class="auth-brand">
                <div class="auth-logo" aria-label="IncidentGraph AI logo">IG</div>
                <h1>IncidentGraph AI</h1>
                <p>Intelligent Incident Monitoring & Root Cause Analysis</p>
                <p class="auth-security">Secure access to your monitoring workspace.</p>
            </div>

            <div class="auth-tabs">
                <button id="loginTab" class="active" type="button">Login</button>
                <button id="registerTab" type="button">Register</button>
            </div>

            <form id="loginForm" class="auth-form" autocomplete="off">
                <label for="loginEmail">Email address</label>
                <input id="loginEmail" type="email" autocomplete="off" placeholder="Enter your email" required>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" autocomplete="new-password" placeholder="Enter your password" required>
                <button class="auth-submit" type="submit">Login</button>
            </form>

            <form id="registerForm" class="auth-form" autocomplete="off" hidden>
                <label for="registerEmail">Email address</label>
                <input id="registerEmail" type="email" autocomplete="email" required>
                <label for="registerPassword">Password</label>
                <input id="registerPassword" type="password" minlength="12" autocomplete="new-password" required>
                <label for="confirmPassword">Confirm password</label>
                <input id="confirmPassword" type="password" minlength="12" autocomplete="new-password" required>
                <label>
                    <input id="ownershipNotice" type="checkbox" required style="width:auto">
                    I will only monitor websites that I own or am authorized to monitor.
                </label>
                <button class="auth-submit" type="submit">Create account</button>
            </form>

            <p id="authMessage" class="auth-message" role="alert"></p>
            <p class="auth-note">New accounts receive standard user access. Administrator access is managed separately.</p>
        </section>
    </main>

    <script src="/frontend/assets/auth.js"></script>
</body>
</html>
