<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DemoShop</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f4f6f8;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            margin-bottom: 5px;
        }

        .status {
            color: green;
            font-weight: bold;
        }

        .products {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }

        .product {
            border: 1px solid #ddd;
            padding: 20px;
            border-radius: 8px;
            width: 200px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>DemoShop</h1>

    <p>
        Demo application monitored by
        <strong>IncidentGraph AI</strong>.
    </p>

    <p>
        Application status:
        <span class="status">Running</span>
    </p>

    <h2>Products</h2>

    <div class="products">

        <div class="product">
            <h3>Laptop</h3>
            <p>₹55,000</p>
        </div>

        <div class="product">
            <h3>Smartphone</h3>
            <p>₹25,000</p>
        </div>

        <div class="product">
            <h3>Headphones</h3>
            <p>₹3,000</p>
        </div>

    </div>

</div>

</body>
</html>
